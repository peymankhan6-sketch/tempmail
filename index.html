<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمپ‌میل رایگان | ایمیل موقت واقعی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header { text-align: center; margin-bottom: 2rem; animation: fadeInDown 0.8s ease; }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        header p { color: var(--text-secondary); font-size: 1.1rem; }

        .main-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.8s ease;
        }

        .email-display {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--primary-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .email-address {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            word-break: break-all;
            text-align: center;
            direction: ltr; /* ایمیل باید چپ‌چین باشد */
        }

        .actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }

        .inbox-section { margin-top: 2rem; }
        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }
        .inbox-title { font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }

        .loading-spinner {
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .email-list {
            display: flex; flex-direction: column; gap: 0.75rem;
            max-height: 400px; overflow-y: auto; padding-right: 0.5rem;
        }
        .email-list::-webkit-scrollbar { width: 6px; }
        .email-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        .email-list::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }

        .email-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 1rem;
            align-items: center;
        }
        .email-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(-5px);
            border-color: var(--primary-color);
        }

        .email-sender-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.2rem;
        }
        .email-info { display: flex; flex-direction: column; gap: 0.25rem; }
        .email-sender { font-weight: 600; color: var(--text-primary); }
        .email-subject {
            color: var(--text-secondary); font-size: 0.9rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px;
        }
        .email-time { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; }

        .empty-inbox {
            text-align: center; padding: 3rem; color: var(--text-secondary);
            display: flex; flex-direction: column; align-items: center; gap: 1rem;
        }
        .empty-inbox i { font-size: 3rem; opacity: 0.3; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px);
            z-index: 1000; justify-content: center; align-items: center; padding: 1rem;
        }
        .modal-content {
            background: #1e293b; border: 1px solid var(--glass-border); border-radius: 20px;
            width: 100%; max-width: 700px; max-height: 80vh;
            display: flex; flex-direction: column; animation: fadeInUp 0.3s ease;
        }
        .modal-header {
            padding: 1.5rem; border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .close-btn {
            background: none; border: none; color: var(--text-secondary);
            font-size: 1.5rem; cursor: pointer; transition: color 0.2s;
        }
        .close-btn:hover { color: #ef4444; }
        .modal-body {
            padding: 1.5rem; overflow-y: auto; line-height: 1.8; color: var(--text-secondary);
        }
        .modal-body h3 { color: var(--text-primary); margin-bottom: 1rem; }

        .toast {
            position: fixed; bottom: 2rem; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success); color: white; padding: 0.75rem 1.5rem;
            border-radius: 50px; font-weight: 600;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000; display: flex; align-items: center; gap: 0.5rem;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .email-address { font-size: 1.1rem; }
            .email-item { grid-template-columns: 1fr; gap: 0.5rem; }
            .email-sender-avatar { display: none; }
            .email-time { align-self: flex-end; }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-envelope-open-text"></i> تمپ‌میل رایگان</h1>
        <p>دریافت ایمیل واقعی، سریع و کاملاً رایگان بدون ثبت‌نام</p>
    </header>

    <div class="main-card">
        <div class="email-display">
            <div style="color: var(--text-secondary); font-size: 0.9rem;">آدرس ایمیل موقت شما:</div>
            <div class="email-address" id="emailAddress">در حال دریافت...</div>
            
            <div class="actions">
                <button class="btn btn-primary" onclick="copyEmail()">
                    <i class="fa-regular fa-copy"></i> کپی آدرس
                </button>
                <button class="btn btn-secondary" onclick="initEmail()">
                    <i class="fa-solid fa-rotate"></i> ساخت ایمیل جدید
                </button>
            </div>
        </div>

        <div class="inbox-section">
            <div class="inbox-header">
                <div class="inbox-title">
                    <i class="fa-solid fa-inbox" style="color: var(--primary-color);"></i>
                    صندوق ورودی
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.9rem;">
                    <div class="loading-spinner" id="spinner" style="display: none;"></div>
                    <span id="refresh-text">بروزرسانی خودکار هر ۵ ثانیه</span>
                </div>
            </div>

            <div class="email-list" id="emailList">
                <div class="empty-inbox">
                    <i class="fa-regular fa-paper-plane"></i>
                    <p>در انتظار دریافت ایمیل...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال نمایش محتوای ایمیل -->
    <div class="modal" id="emailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalSubject">موضوع ایمیل</h3>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 1rem; color: var(--primary-color);">از: <span id="modalSender"></span></p>
                <p style="margin-bottom: 1rem; font-size: 0.9rem;">تاریخ: <span id="modalDate"></span></p>
                <hr style="border: 0; border-top: 1px solid var(--glass-border); margin-bottom: 1rem;">
                <div id="modalBodyText"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fa-solid fa-check-circle"></i>
        <span>آدرس ایمیل کپی شد!</span>
    </div>

    <script>
        let currentLogin = '';
        let currentDomain = '';
        let checkInterval = null;
        let lastMessageCount = 0;

        // API رایگان 1secmail
        const API_BASE = 'https://www.1secmail.com/api/v1/';

        // تولید رشته تصادفی برای نام کاربری
        function generateRandomString(length) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // راه‌اندازی اولیه ایمیل
        async function initEmail() {
            document.getElementById('emailAddress').innerText = 'در حال دریافت دامنه...';
            document.getElementById('emailList').innerHTML = `
                <div class="empty-inbox">
                    <i class="fa-regular fa-paper-plane"></i>
                    <p>در انتظار دریافت ایمیل...</p>
                </div>
            `;
            lastMessageCount = 0;

            try {
                // دریافت لیست دامنه‌های رایگان
                const response = await fetch(`${API_BASE}?action=getDomainList`);
                const domains = await response.json();
                
                // انتخاب یک دامنه تصادفی
                currentDomain = domains[Math.floor(Math.random() * domains.length)];
                currentLogin = generateRandomString(10);
                
                const fullEmail = `${currentLogin}@${currentDomain}`;
                document.getElementById('emailAddress').innerText = fullEmail;

                // شروع بررسی خودکار اینباکس
                if (checkInterval) clearInterval(checkInterval);
                checkInbox(); // بررسی فوری
                checkInterval = setInterval(checkInbox, 5000); // بررسی هر 5 ثانیه

            } catch (error) {
                console.error('خطا در دریافت اطلاعات:', error);
                document.getElementById('emailAddress').innerText = 'خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.';
            }
        }

        // بررسی اینباکس
        async function checkInbox() {
            if (!currentLogin || !currentDomain) return;
            
            document.getElementById('spinner').style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}?action=getMessages&login=${currentLogin}&domain=${currentDomain}`);
                const messages = await response.json();

                document.getElementById('spinner').style.display = 'none';

                if (messages.length === 0) {
                    if (lastMessageCount === 0) {
                        document.getElementById('emailList').innerHTML = `
                            <div class="empty-inbox">
                                <i class="fa-regular fa-paper-plane"></i>
                                <p>هنوز ایمیلی دریافت نشده است.<br>آدرس را کپی کنید و منتظر بمانید...</p>
                            </div>
                        `;
                    }
                    return;
                }

                // اگر پیام جدیدی آمده است
                if (messages.length > lastMessageCount) {
                    lastMessageCount = messages.length;
                    renderEmails(messages);
                }

            } catch (error) {
                console.error('خطا در بررسی اینباکس:', error);
                document.getElementById('spinner').style.display = 'none';
            }
        }

        // نمایش لیست ایمیل‌ها
        function renderEmails(messages) {
            const emailList = document.getElementById('emailList');
            emailList.innerHTML = '';

            messages.forEach(msg => {
                const item = document.createElement('div');
                item.className = 'email-item';
                item.onclick = () => openEmail(msg.id);
                
                // استخراج حرف اول فرستنده برای آواتار
                const firstLetter = msg.from.charAt(0).toUpperCase();

                item.innerHTML = `
                    <div class="email-sender-avatar">${firstLetter}</div>
                    <div class="email-info">
                        <div class="email-sender">${msg.from}</div>
                        <div class="email-subject">${msg.subject || 'بدون موضوع'}</div>
                    </div>
                    <div class="email-time">${msg.date}</div>
                `;
                emailList.appendChild(item);
            });
        }

        // باز کردن و خواندن یک ایمیل خاص
        async function openEmail(id) {
            document.getElementById('spinner').style.display = 'block';
            try {
                const response = await fetch(`${API_BASE}?action=readMessage&login=${currentLogin}&domain=${currentDomain}&id=${id}`);
                const emailData = await response.json();
                
                document.getElementById('modalSubject').innerText = emailData.subject || 'بدون موضوع';
                document.getElementById('modalSender').innerText = emailData.from;
                document.getElementById('modalDate').innerText = emailData.date;
                
                // نمایش بدنه ایمیل (اگر HTML بود همان، در غیر این صورت متن ساده)
                document.getElementById('modalBodyText').innerHTML = emailData.htmlBody || emailData.textBody || 'محتوای خالی';
                
                document.getElementById('emailModal').style.display = 'flex';
            } catch (error) {
                alert('خطا در دریافت محتوای ایمیل');
            } finally {
                document.getElementById('spinner').style.display = 'none';
            }
        }

        // کپی در کلیپ‌بورد
        function copyEmail() {
            const email = document.getElementById('emailAddress').innerText;
            if(email.includes('@')) {
                navigator.clipboard.writeText(email).then(() => showToast());
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function closeModal() {
            document.getElementById('emailModal').style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('emailModal')) closeModal();
        }

        // شروع برنامه هنگام لود صفحه
        window.onload = initEmail;
    </script>
</body>
</html>
